name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches Version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/app/server.go)
          echo "tag=$tag  internal/app/server.go=$code"
          [ "$tag" = "$code" ] || { echo "::error::tag $tag does not match internal/app/server.go Version $code"; exit 1; }

      - run: go test ./...

      - name: Cross compile
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/gemini-web2api-go_${ver}_${os}_${arch}"
            [ "$os" = "windows" ] && bin="$out.exe" || bin="$out"
            echo "building $bin"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$bin" .
          done
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Build release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          {
            echo "Single binary download for your platform, no Go or Docker required:"
            echo
            echo '```bash'
            echo 'chmod +x gemini-web2api-go_*'
            echo './gemini-web2api-go_* --port 8083 --admin-token your-admin-token'
            echo '```'
            echo
            echo "Container images: \`ghcr.io/${{ github.repository }}\`. Verify checksums with \`SHA256SUMS.txt\`."
            section=$(awk -v v="$ver" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
            if [ -n "$section" ]; then
              echo
              echo "## Release notes"
              echo "$section"
            fi
          } > release_body.md
          cat release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: release_body.md
